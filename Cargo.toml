[package]
name = "lensight"
version = "1.0.2"
edition = "2021"
description = "A command-line tool for embedding camera metadata and shooting details into photos."
authors = ["AngelMsger <angelmsger@vip.qq.com>"]
license = "MIT"
repository = "https://github.com/AngelMsger/lensight"
readme = "README.md"

[dependencies]
image = "0.24.9"
kamadak-exif = "0.5.5"
clap = { version = "4.5.41", features = ["derive"] }
walkdir = "2.5.0"
imageproc = "0.23.0"
rusttype = "0.9.3"
base64 = "0.21.7"

[dev-dependencies]
assert_fs = "1.1.3"
tempfile = "3.20.0"

[[bin]]
name = "lensight"
path = "src/main.rs"

[lib]
name = "lensight"
path = "src/lib.rs"
